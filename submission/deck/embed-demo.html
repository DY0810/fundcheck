<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Embed demo: a stand-in funding page</title>
<!-- A stand-in page for the deck's placement picture (placement.png). It is not a copy of USG's page:
     neutral greys and the deck's own tokens only. The iframe line is the whole embed.
     Capture: Chrome headless, --window-size=1280,1288 --force-device-scale-factor=2. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --panel: #ffffff; --inset: #f0f0ee; --line: #dcdcdc; --ink: #1b1b1b; --ink-2: #565c65; --brand-tint: #fff2bf; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 1280px; font-family: 'Public Sans', system-ui, sans-serif; color: var(--ink); background: var(--panel); }
  /* The label is part of the picture, sized to stay readable when the picture is scaled down on the slide. */
  .label { margin: 0; padding: 10px 24px; background: var(--brand-tint); font-size: 40px; line-height: 48px; font-weight: 600; letter-spacing: -0.015em; text-align: center; }
  .bar { display: flex; align-items: center; gap: 20px; height: 52px; padding: 0 20px; background: #e4e5e6; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: #b4b8bc; }
  .addr { flex: 1; margin: 0; padding: 4px 20px; border-radius: 999px; background: var(--panel); font-size: 24px; line-height: 32px; }
  .hdr { display: flex; align-items: center; gap: 28px; height: 44px; padding: 0 32px; background: #45494f; }
  .hdr i { height: 12px; border-radius: 6px; background: #8d9299; }
  .wrap { padding: 20px 32px; }
  h1 { margin: 0 0 12px; font-size: 44px; line-height: 48px; font-weight: 600; letter-spacing: -0.025em; }
  .ph { height: 14px; margin-top: 10px; border-radius: 7px; background: #e3e4e5; }
  iframe { display: block; margin-top: 16px; }
  .below { height: 44px; margin-top: 16px; border-radius: 10px; background: var(--inset); }
</style>
</head>
<body>
<p class="label">Proposed placement, mockup. Not live on USG’s site.</p>
<div class="bar" aria-hidden="true">
  <span class="dots"><i></i><i></i><i></i></span>
  <p class="addr">usg.usc.edu/branches/funding</p>
</div>
<div class="hdr" aria-hidden="true"><i style="width:120px"></i><i style="width:72px"></i><i style="width:72px"></i><i style="width:72px"></i></div>
<div class="wrap">
  <h1>Funding</h1>
  <div class="ph" style="width:78%"></div>
  <div class="ph" style="width:52%"></div>
  <iframe src="https://fundcheck.cyberprivacy.workers.dev" title="FundCheck pre-check" allow="clipboard-write" style="width:100%;height:900px;border:0"></iframe>
  <div class="below"></div>
</div>
</body>
</html>
